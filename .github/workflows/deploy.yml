name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /sc-alpr-radar/
      # Statewide map-detail tiles from build-osm-tiles.yml. Until that has
      # run once there's no asset, and the app falls back to live Overpass.
      - name: Add OSM detail tiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download osm-tiles -p osm-tiles.tar.gz -D /tmp; then
            mkdir -p dist/osm && tar -xzf /tmp/osm-tiles.tar.gz -C dist/osm
            echo "Added $(find dist/osm -name '*.json' | wc -l) tile files."
          else
            echo "No OSM tiles published yet; skipping."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
